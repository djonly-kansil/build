name: Android CI/CD Build and Deploy

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual triggers from GitHub Actions UI

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Create Empty Secrets Env File
        run: |
          touch .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env

      - name: Build with Gradle
        # We build both Debug (which is pre-signed) and Release APKs.
        # If signing secrets are not configured, assembleRelease may fail,
        # so you can build only debug first, or supply keys.
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  deploy:
    name: Deploy APK to Server
    needs: build
    runs-on: ubuntu-latest
    # Only deploy on pushes to main or master, not on pull requests
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Download Built APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug-apk
          path: build-artifacts

      # ========================================================================
      # OPTION 1: DEPLOY TO CUSTOM SERVER VIA SSH/SFTP (RECOMMENDED FOR WEBSERVERS)
      # ========================================================================
      # This option copies the APK to your VPS or dedicated server.
      # To use this, add the following secrets in your GitHub Repository Settings:
      # - SERVER_HOST: Server IP or Domain Name
      # - SERVER_USERNAME: Username (e.g., ubuntu, root)
      # - SERVER_SSH_KEY: Private SSH key to log into the server
      # - SERVER_TARGET_DIR: Target folder path on your server (e.g., /var/www/html/downloads/)
      # ========================================================================
      - name: Deploy to Custom Server via SFTP/SCP
        # Uncomment the lines below when you have configured your GitHub Secrets:
        # uses: appleboy/scp-action@v0.1.7
        # with:
        #   host: ${{ secrets.SERVER_HOST }}
        #   username: ${{ secrets.SERVER_USERNAME }}
        #   key: ${{ secrets.SERVER_SSH_KEY }}
        #   port: 22
        #   source: "build-artifacts/app-debug.apk"
        #   target: ${{ secrets.SERVER_TARGET_DIR }}
        #   strip_components: 1
        run: echo "Custom server deployment step ready! Configure SERVER_HOST and other secrets to activate."

      # ========================================================================
      # OPTION 2: DEPLOY TO GITHUB RELEASES (FOR RELEASING REPO TAGS)
      # ========================================================================
      # This option automatically creates a draft release and uploads the APK.
      # ========================================================================
      - name: Create GitHub Release and Upload APK
        # Uncomment the lines below to enable automated GitHub Release uploads:
        # uses: softprops/action-gh-release@v2
        # if: startsWith(github.ref, 'refs/tags/')
        # with:
        #   files: build-artifacts/app-debug.apk
        #   draft: false
        #   prerelease: false
        # env:
        #   GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "GitHub Release upload step is configured for Tag triggers."

      # ========================================================================
      # OPTION 3: DEPLOY TO FIREBASE APP DISTRIBUTION
      # ========================================================================
      # Perfect for sharing beta builds with testers.
      # Requires setting up a Firebase project and adding:
      # - FIREBASE_APP_DISTRIBUTION_CREDENTIALS or FIREBASE_TOKEN
      # - FIREBASE_APP_ID (obtained from Firebase Settings -> General -> App ID)
      # ========================================================================
      - name: Deploy to Firebase App Distribution
        # Uncomment the lines below to enable Firebase App Distribution:
        # uses: w9jds/firebase-action@master
        # with:
        #   args: appdistribution:distribute build-artifacts/app-debug.apk --app ${{ secrets.FIREBASE_APP_ID }} --groups testers
        # env:
        #   FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: echo "Firebase App Distribution step ready."
